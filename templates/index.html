<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek API — история запросов</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">AI ADVENT · API DEMO</p>
        <h1>Запросы к DeepSeek</h1>
        <p class="subtitle">Отправьте сообщение и посмотрите полный JSON-ответ API.</p>
      </header>

      <section class="composer" aria-labelledby="form-title">
        <div class="composer__heading">
          <h2 id="form-title">Новый запрос</h2>
          <span class="model-badge">{{ model }}</span>
        </div>

        <form id="prompt-form">
          <label for="prompt">Сообщение</label>
          <textarea
            id="prompt"
            name="prompt"
            rows="5"
            placeholder="Например: Объясни простыми словами, что такое API"
            required
          ></textarea>
          <div class="form-footer">
            <span class="hint">⌘/Ctrl + Enter — отправить</span>
            <button id="submit-button" type="submit">
              <span class="button-label">Отправить</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </div>
        </form>
      </section>

      <section class="history" aria-labelledby="history-title">
        <div class="history__heading">
          <div>
            <p class="eyebrow">ИСТОРИЯ</p>
            <h2 id="history-title">Запросы и ответы</h2>
          </div>
          <span id="request-count" class="counter">0 запросов</span>
        </div>

        <div id="empty-state" class="empty-state">
          <span class="empty-state__icon">{ }</span>
          <p>Здесь появятся отправленные запросы и JSON-ответы.</p>
        </div>
        <div id="request-list" class="request-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="request-template">
      <article class="request-card">
        <div class="request-card__topline">
          <time class="request-time"></time>
          <span class="request-status"></span>
        </div>
        <h3>Запрос</h3>
        <p class="request-prompt"></p>
        <div class="answer-block">
          <h3>Ответ</h3>
          <p class="assistant-answer"></p>
        </div>
        <details class="json-details">
          <summary>
            <span>JSON-ответ</span>
            <span class="chevron" aria-hidden="true"></span>
          </summary>
          <div class="json-content">
            <div class="json-heading">
              <span>Полный ответ API</span>
              <button class="copy-button" type="button">Копировать</button>
            </div>
            <pre><code class="response-json"></code></pre>
          </div>
        </details>
      </article>
    </template>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
